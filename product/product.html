<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Pesan menu favorit KOPICU dengan mudah.">
  <title>Kopicu</title>

  <link rel="stylesheet" href="product.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <header class="outlet-header">

    <div class="outlet-decoration">
      <span class="decoration-star star-one">✦</span>
      <span class="decoration-star star-two">✧</span>
      <span class="decoration-star star-three">✦</span>

      <span class="decoration-moon">
        <i class="fa-solid fa-moon"></i>
      </span>

      <span class="decoration-cloud cloud-one"></span>
      <span class="decoration-cloud cloud-two"></span>
    </div>

    <div class="outlet-content">

      <button
        id="outlet-selector"
        class="outlet-selector"
        type="button"
        aria-label="Pilih outlet toko"
      >
        <span class="outlet-selector-text">
          <span id="outlet-title">Pilih outlet</span>
          <span id="outlet-address" hidden></span>
        </span>

        <span class="outlet-selector-icon">
          <i class="fa-solid fa-chevron-down"></i>
        </span>
      </button>

      <div id="outlet-services" class="outlet-services" hidden>
        <span class="outlet-services-icon">
          <i class="fa-solid fa-store"></i>
        </span>

        <p id="outlet-services-text">
          Melayani Delivery / Pickup / Dine In
        </p>
      </div>

    </div>

  </header>

  <main class="page">

    <section class="banner-section">
      <div id="banner-list" class="banner-list">
        <div class="skeleton banner-skeleton"></div>
      </div>
      <div id="banner-dots" class="banner-dots"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Kategori</h2>
        <button id="show-all-categories" class="text-button" type="button">
          Lihat semua
        </button>
      </div>

      <div id="category-list" class="category-list">
        <div class="skeleton category-skeleton"></div>
        <div class="skeleton category-skeleton"></div>
        <div class="skeleton category-skeleton"></div>
      </div>
    </section>

    <section class="section products-section">
      <div class="section-heading">
        <h2 id="products-heading">Menu</h2>
        <button id="reset-category" class="text-button" type="button" hidden>
          Semua menu
        </button>
      </div>

      <div id="product-list" class="product-list">
        <div class="skeleton product-skeleton"></div>
        <div class="skeleton product-skeleton"></div>
      </div>

      <p id="empty-state" class="empty-state" hidden>
        Produk belum tersedia.
      </p>
    </section>

  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" href="index.html">
      <i class="fa-solid fa-house"></i>
      <span>Beranda</span>
    </a>

    <a class="nav-item" href="customer/cart.html">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Keranjang</span>
    </a>

    <a class="nav-item" href="customer/orders.html">
      <i class="fa-solid fa-receipt"></i>
      <span>Pesanan</span>
    </a>

    <a class="nav-item" href="customer/profile.html">
      <i class="fa-regular fa-user"></i>
      <span>Akun</span>
    </a>
  </nav>

  <script type="module" src="product.js"></script>

</body>
</html>
